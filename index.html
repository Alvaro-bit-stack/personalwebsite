<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inside My Head</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#1c2130; --bg2:#141824; --panel:#252b3a; --line:#343b4e;
    --ink:#f1ebe2; --muted:#a7aec0; --lamp:#f2b36b; --wall:#b85a44;
    --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 90% at 50% 30%, var(--bg) 0%, var(--bg2) 100%);color:var(--ink);font-family:var(--body);overflow:hidden}
  #stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;z-index:1}
  #css3d{position:fixed;inset:0;z-index:0;pointer-events:none}
  .ui{position:fixed;inset:0;z-index:2;pointer-events:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .brand h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4.2vw,44px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
  .brand h1 span{color:var(--lamp)}
  .brand p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:34ch}
  .actions{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
  button,.file{font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s}
  button:hover,.file:hover{border-color:var(--lamp)}
  button:focus-visible,.file:focus-within{outline:2px solid var(--lamp);outline-offset:2px}
  button.primary{background:var(--lamp);color:#2a1a0c;border-color:var(--lamp)}
  .file input{position:absolute;width:1px;height:1px;opacity:0}
  .file{position:relative;display:inline-flex;align-items:center}
  .bottom{display:flex;justify-content:center}
  .catsheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -18px 40px rgba(0,0,0,.35);padding:14px 18px 16px;max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
  .catsheet .cs-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .catsheet .cs-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp);margin:0 0 2px}
  .catsheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 4px}
  .catsheet .cs-text{margin:0;color:var(--muted);line-height:1.45;max-width:62ch;font-size:14px}
  .catsheet #csBack{flex:none;font:600 13px var(--body);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
  .catsheet .cs-hint{margin:6px 0 0;color:var(--lamp);font-size:13px;font-weight:600}
  .catsheet .cs-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
  .catsheet .cs-strip button{flex:1 1 0;min-width:150px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#0d111b;cursor:zoom-in;scroll-snap-align:start;text-align:left;color:var(--muted)}
  .catsheet .cs-strip img{display:block;width:100%;height:min(190px,22vh);object-fit:cover;object-position:50% 15%}
  .catsheet .cs-strip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:1.3;margin:6px 8px;padding:0}
  .lightbox{position:fixed;inset:0;z-index:9;background:rgba(6,8,14,.88);display:grid;place-items:center;padding:24px}
  .lightbox figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
  .lightbox img{max-width:min(92vw,900px);max-height:78vh;border-radius:12px;display:block}
  .lightbox figcaption{color:var(--ink);font-size:14px}
  .lightbox button{position:absolute;border:1px solid var(--line);background:rgba(20,24,36,.8);color:var(--ink);border-radius:999px;width:42px;height:42px;font:700 26px/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0}
  .lightbox .lbclose{top:16px;right:16px} .lightbox .prev{left:16px;top:50%} .lightbox .next{right:16px;top:50%}
  .hint{font-size:14px;color:var(--muted);background:rgba(20,24,36,.7);border:1px solid var(--line);padding:8px 14px;border-radius:999px;backdrop-filter:blur(6px)}
  .hint b{color:var(--ink);font-weight:600}
  .panel{pointer-events:auto;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
  .panel .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lamp);margin:0 0 4px}
  .panel h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0 0 6px;text-wrap:balance}
  .panel p{margin:0;color:var(--muted);line-height:1.5}
  .panel .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .panel a{color:var(--lamp)}
  .panel .cover{float:right;width:76px;height:76px;object-fit:cover;border-radius:8px;margin:0 0 8px 12px;border:1px solid var(--line)}
  .panel .btns{display:flex;gap:8px}
  .panel .gallery{margin-top:12px}
  .panel .gmain{position:relative;height:min(300px,38vh);border-radius:10px;overflow:hidden;background:#0d111b;border:1px solid var(--line)}
  .panel .gmain img{width:100%;height:100%;object-fit:contain;display:block}
  .panel .gnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:rgba(15,18,28,.72);color:var(--ink);font:700 22px/1 var(--body);cursor:pointer;display:grid;place-items:center;padding:0}
  .panel .gnav.prev{left:8px} .panel .gnav.next{right:8px}
  .panel .gcap{margin:8px 0 0;font-size:13px}
  .panel .gthumbs{display:flex;gap:6px;margin-top:8px}
  .panel .gthumbs button{width:52px;height:52px;padding:0;border-radius:8px;overflow:hidden;border:2px solid transparent;background:none;cursor:pointer;opacity:.65}
  .panel .gthumbs button[aria-current="true"]{border-color:var(--lamp);opacity:1}
  .panel .gthumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .panel .links{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
  .panel .links a{font:600 13px var(--body);color:var(--ink);text-decoration:none;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
  .panel .links a:hover{border-color:var(--lamp)}
  .panel .links .email{flex-basis:100%;font:600 15px var(--body);color:var(--lamp);user-select:all;word-break:break-all}
  .panel .links button{padding:6px 12px;font-size:13px}
  .tip{position:fixed;z-index:4;pointer-events:none;font:600 12px var(--body);background:var(--ink);color:#1c2130;padding:4px 8px;border-radius:6px;transform:translate(12px,12px);white-space:nowrap}
  .loading{position:fixed;inset:0;z-index:4;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--muted)}
  /* ---------- the little desktop on the monitor ---------- */
  #osWrap{width:1280px;height:772px;overflow:hidden;background:#0b0d12;pointer-events:none}
  #osWrap.live{pointer-events:auto}
  #osFlat{position:fixed;left:0;top:0;z-index:5;overflow:hidden}
  #osFlat #osWrap{position:absolute;left:0;top:0;transform-origin:0 0}
  #os{position:absolute;left:0;top:0;width:1280px;height:772px;font-family:var(--body);color:#1d2230;user-select:none;overflow:hidden;
      background:radial-gradient(circle at 78% 72%, #f2b36b 0 70px, rgba(242,179,107,.35) 71px 150px, transparent 151px), linear-gradient(170deg,#1f2440 0%,#4a2f4f 45%,#b85a44 100%)}
  #os button{font-family:var(--body)}
  .os-lock,.os-login{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;
      background:linear-gradient(170deg,rgba(15,18,32,.35),rgba(15,18,32,.55))}
  .os-lock .t{font:800 132px/1 var(--display);letter-spacing:-.02em}
  .os-lock .d{font:500 28px var(--body);opacity:.9;margin-top:10px}
  .os-lock .h{position:absolute;bottom:60px;font:600 18px var(--body);opacity:.8;animation:osPulse 2s ease-in-out infinite}
  @keyframes osPulse{50%{opacity:.35}}
  .os-login{backdrop-filter:blur(10px);cursor:default}
  .os-login .av{width:150px;height:150px;border-radius:50%;background:#f2b36b;color:#2a1a0c;display:grid;place-items:center;font:800 70px var(--display);box-shadow:0 0 0 6px rgba(255,255,255,.25)}
  .os-login .nm{font:700 36px var(--display);margin:22px 0 18px}
  .os-login button{font:600 20px var(--body);padding:12px 34px;border-radius:999px;border:0;background:#fff;color:#1d2230;cursor:pointer}
  .os-login .dots{font:600 20px var(--body);height:28px}
  .os-desk{position:absolute;inset:0}
  .os-icon{position:absolute;width:108px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px;color:#fff;font:600 16px var(--body);text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);cursor:pointer;touch-action:none}
  .os-icon:hover{background:rgba(255,255,255,.14)}
  .os-icon svg{width:64px;height:64px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
  .os-win{position:absolute;background:#f6f3ee;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;min-width:320px}
  .os-bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;background:#e9e4dc;font:700 16px var(--body);cursor:grab;touch-action:none;flex:none}
  .os-bar .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .os-bar button{width:34px;height:30px;border:0;border-radius:6px;background:transparent;font:700 16px var(--body);color:#1d2230;cursor:pointer}
  .os-bar button:hover{background:#d8d1c6} .os-bar button.x:hover{background:#d9564b;color:#fff}
  .os-body{flex:1;overflow:auto;padding:22px;font:400 17px/1.5 var(--body)}
  .os-files{display:flex;flex-wrap:wrap;gap:18px}
  .os-file{width:120px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:10px;cursor:pointer;font:600 15px var(--body);text-align:center}
  .os-file:hover{background:#e6dfd4}
  .os-file svg{width:70px;height:70px}
  .os-proj h3{font:800 34px/1.1 var(--display);margin:0 0 6px}
  .os-proj .tag{color:#5b6173;margin:0 0 16px}
  .os-proj ul{margin:0 0 16px;padding-left:20px}
  .os-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
  .os-chips span{font:600 13px var(--body);background:#1d2230;color:#f1ebe2;padding:5px 11px;border-radius:999px}
  .os-btns{display:flex;flex-wrap:wrap;gap:10px}
  .os-btns a,.os-btns button{font:600 16px var(--body);padding:10px 18px;border-radius:999px;border:0;background:#1d2230;color:#fff;text-decoration:none;cursor:pointer}
  .os-btns .alt{background:#e2dbd0;color:#1d2230}
  .os-browser{padding:0;display:flex;flex-direction:column}
  .os-addr{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#ece7df;border-bottom:1px solid #d9d2c7;font:500 15px var(--body)}
  .os-addr .url{flex:1;background:#fff;border-radius:999px;padding:6px 14px;color:#3b4150}
  .os-addr a{font:600 14px var(--body);color:#b85a44;text-decoration:none}
  .os-browser iframe{flex:1;border:0;width:100%;background:#fff}
  .os-noembed{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;color:#3b4150}
  .os-noembed b{font:800 30px var(--display);color:#1d2230}
  .sch{flex:1;overflow:auto;background:linear-gradient(180deg,#f5f7ff,#fff);color:#141a2e;padding:26px 44px 30px;font-family:var(--body)}
  .sch nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}
  .sch nav b{font:800 24px var(--display);color:#3f72d8}
  .sch nav span{font:600 15px var(--body);background:#141a2e;color:#fff;padding:9px 16px;border-radius:999px}
  .sch h1{font:800 54px/1.05 var(--display);margin:0 0 14px;max-width:760px;letter-spacing:-.01em}
  .sch p{font:400 20px/1.5 var(--body);color:#4a526a;margin:0 0 30px;max-width:640px}
  .sch .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .sch .steps div{background:#fff;border:1px solid #dfe4f2;border-radius:14px;padding:18px;font:600 17px/1.35 var(--body)}
  .sch .steps i{display:block;font:800 30px var(--display);color:#3f72d8;font-style:normal;margin-bottom:6px}
  .sch small{display:block;margin-top:26px;color:#7a8194;font:500 14px var(--body)}
  .os-note{width:100%;height:100%;min-height:260px;border:0;resize:none;background:transparent;font:400 18px/1.6 ui-monospace,Consolas,monospace;color:#1d2230;outline:none}
  .os-task{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;background:rgba(18,21,33,.82);backdrop-filter:blur(12px);color:#fff}
  .os-task .start{width:44px;height:44px;border-radius:10px;border:0;background:#f2b36b;color:#2a1a0c;font:800 22px var(--display);cursor:pointer}
  .os-task .tb{height:42px;padding:0 16px;border-radius:8px;border:0;background:rgba(255,255,255,.1);color:#fff;font:600 15px var(--body);cursor:pointer;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .os-task .tb.on{background:rgba(255,255,255,.24);box-shadow:inset 0 -3px 0 #f2b36b}
  .os-task a.tb{display:flex;align-items:center;gap:8px;text-decoration:none}
  .os-task .emi{background:linear-gradient(180deg,rgba(150,225,255,.35),rgba(40,150,220,.35));box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
  .os-task .emi svg{width:26px;height:26px}
  .os-emi{display:flex;flex-direction:column;gap:14px}
  .os-emi .hero{display:flex;align-items:center;gap:16px;padding:18px;border-radius:14px;color:#06324a;
     background:linear-gradient(180deg,#e9f9ff 0%,#9fe0fb 48%,#46b9ea 52%,#8fd9f7 100%);box-shadow:inset 0 1px 0 #fff, 0 6px 16px rgba(20,120,180,.25)}
  .os-emi .hero svg{width:64px;height:64px;flex:none}
  .os-emi .hero b{display:block;font:800 32px/1 var(--display)}
  .os-emi .hero span{font:600 16px var(--body);opacity:.8}
  .os-emi p{margin:0}
  .os-emi .shout{font:700 18px var(--body);color:#b85a44}
  .os-task .clock{margin-left:auto;text-align:right;font:600 15px/1.2 var(--body)}
  .os-menu{position:absolute;left:12px;bottom:66px;width:300px;background:rgba(24,28,42,.95);border-radius:12px;padding:14px;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .os-menu .who{display:flex;align-items:center;gap:12px;font:700 18px var(--display);padding:4px 6px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
  .os-menu .who span{width:40px;height:40px;border-radius:50%;background:#f2b36b;color:#2a1a0c;display:grid;place-items:center;font:800 20px var(--display)}
  .os-menu button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:8px;background:transparent;color:#fff;font:600 16px var(--body);cursor:pointer}
  .os-menu button:hover{background:rgba(255,255,255,.1)}
  #osBack{position:fixed;z-index:7;left:16px;top:calc(16px + env(safe-area-inset-top,0px));font:600 14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer}
  #osBack:hover{border-color:var(--lamp)}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>


<canvas id="stage" aria-label="3D character: click the head to open it and explore the room inside"></canvas>
<div class="loading" id="loading">Loading my head…</div>
<div class="tip" id="tip" hidden></div>

<div class="ui">
  <div class="top">
    <div class="brand">
      <h1>Inside <span>my head</span></h1>
      <p>A little room where I keep my projects, clips and favorite things.</p>
    </div>
    <div class="actions">
      <button id="toggle" class="primary" type="button">Look inside</button>
    </div>
  </div>
  <div class="bottom">
    <div class="hint" id="hint">Click my head to <b>look inside</b></div>
    <div class="panel" id="panel" hidden>
      <img id="pCover" class="cover" alt="" hidden>
      <p class="eyebrow" id="pEyebrow">Room</p>
      <h2 id="pTitle">Title</h2>
      <p id="pText">Text</p>
      <div id="pGallery" class="gallery" hidden>
        <div class="gmain"><img id="gImg" alt=""><button type="button" class="gnav prev" id="gPrev" aria-label="Previous photo">&#8249;</button><button type="button" class="gnav next" id="gNext" aria-label="Next photo">&#8250;</button></div>
        <p class="gcap" id="gCap"></p>
        <div class="gthumbs" id="gThumbs"></div>
      </div>
      <div id="pLinks" class="links" hidden></div>
      <div class="row">
        <span id="pExtra"></span>
        <span class="btns"><button id="pAction" type="button" hidden>Pause</button><button id="pClose" type="button">Close</button></span>
      </div>
    </div>
  </div>
</div>

<div id="catSheet" class="catsheet" hidden>
  <div class="cs-head">
    <div><p class="cs-eyebrow">My cat</p><h2 id="csTitle">Daisy</h2><p class="cs-text" id="csText"></p><p class="cs-hint" id="csHint"></p></div>
    <button type="button" id="csBack">Back to the room</button>
  </div>
  <div class="cs-strip" id="csStrip"></div>
</div>
<div id="lightbox" class="lightbox" hidden><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure><button type="button" id="lbPrev" class="lbnav prev" aria-label="Previous photo">&#8249;</button><button type="button" id="lbNext" class="lbnav next" aria-label="Next photo">&#8250;</button><button type="button" id="lbClose" class="lbclose" aria-label="Close">&times;</button></div>
<div id="osWrap"><div id="os"></div></div>
<div id="osFlat" hidden></div>
<button id="osBack" type="button" hidden>← Back to the room</button>
<script>
  (function(){
    var f = window.fetch && window.fetch.bind(window);
    if (!f || typeof Request === 'undefined') return;
    window.fetch = function(input, init){
      if (input instanceof Request){
        var h = {}; input.headers.forEach(function(v,k){ h[k] = v; });
        return f(input.url, Object.assign({ method:input.method, headers:h, credentials:input.credentials }, init || {}));
      }
      return f(input, init);
    };
  })();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

} }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

/* ------------------------------------------------------------------
   EDIT ME: what each thing in the room shows when it's clicked.
   Keys match the start of the part names inside head.glb.
------------------------------------------------------------------- */
const HOTSPOTS = [
  { match:/^(TV_|TVDesk|TVChair)/,                         id:'tv',      eyebrow:'TV',        title:'Clips',            text:'A few clips on repeat. Click the TV again to turn the sound on or off.' },
  { match:/^(Monitor_|Keyboard|Mouse)/,            id:'computer',eyebrow:'Computer',  title:'My computer',      text:'Click to sit down at the computer.' },
  { match:/^(Shelf|ShelfBook)/,                    id:'shelf',   eyebrow:'Shelf',     title:'Reading list',     text:'Books or articles that shaped how you think.' },
  { match:/^(Desk|DrawerLine|Notebook|Pen)/,       id:'desk',    eyebrow:'Desk',      title:'Notes',            text:'School, work, or what you are learning.' },
  { match:/^Phone_/,                               id:'phone',   eyebrow:'Phone',     title:'Contact me',       text:'' },
  { match:/^Window/,                               id:'window',  eyebrow:'Window',    title:"What's next",      text:'Goals, plans, or where you want to go.' },
  { match:/^CDShelf/,                              id:'cdshelf', eyebrow:'Shelf',     title:'My CDs',           text:'Pick a CD from the shelf and it goes into the boombox.' },
  { match:/^CDPlayer/,                             id:'player',  eyebrow:'Boombox',   title:'CD player',        text:'Click to zoom in and use the buttons.' },
  { match:/^Clock/,                                id:'clock',   eyebrow:'Clock',     title:'Right now',        text:"A 'now' section: what you're focused on this month." },

// On your own site, keep MODEL_URL = 'head.glb'. The hosted demo ships the

const MODEL_URL = 'head.glb';
function loadModel(onLoad, onError){
  const loader = new GLTFLoader();
  // The hosted demo carries the model inside the page (<script id="model-b64">), so it
  // needs no network request. On your own site that tag is absent and head.glb loads normally.
  const embedded = document.getElementById('model-b64');
  if (!embedded) return loader.load(MODEL_URL, onLoad, undefined, onError);
  try {
    const bin = atob(embedded.textContent.trim()); const buf = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    loader.parse(buf.buffer, '', onLoad, onError);
  } catch (e) { onError(e); }
}

function ringSound(){
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  const ctx = new AC(), g = ctx.createGain(); g.gain.value = 0; g.connect(ctx.destination);
  [440, 480].forEach(f=>{ const o = ctx.createOscillator(); o.frequency.value = f; o.connect(g); o.start(); o.stop(ctx.currentTime+1.3); });
  const t = ctx.currentTime;
  for (const [a,b] of [[0,0.4],[0.6,1.0]]){
    for (let x = a; x < b; x += 0.05){ g.gain.setValueAtTime(0.04, t+x); g.gain.setValueAtTime(0.0, t+x+0.025); }
  }
  setTimeout(()=>ctx.close(), 1500);
}

// A little built-in tune for CDs that don't have a song file yet (different for each CD)
function makeSynth(seed){
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
  const ctx = new AC();
  const scale = [0,2,4,7,9,12,14,16,19];
  const root = 196 * Math.pow(2, ((seed*5) % 12)/12);
  let rnd = (seed+1)*7919;
  const next = ()=> (rnd = (rnd*9301+49297) % 233280) / 233280;
  const pattern = Array.from({length:16}, ()=> next() < 0.72 ? scale[Math.floor(next()*scale.length)] : null);
  const beat = 0.17 + (seed % 3)*0.03;
  const master = ctx.createGain(); master.gain.value = 0.12; master.connect(ctx.destination);
  function note(semi, t, len, type, vol){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = root*Math.pow(2, semi/12);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+len);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+len+0.05);
  }
  let step = 0;
  const id = setInterval(()=>{
    if (ctx.state !== 'running') return;
    const t = ctx.currentTime + 0.05, s = pattern[step % 16];
    if (s !== null) note(s, t, beat*1.6, 'triangle', 0.9);
    if (step % 4 === 0) note(step % 16 === 8 ? -7 : -12, t, beat*3.5, 'sine', 0.8);
    step++;
  }, beat*1000);
  return { stop(){ clearInterval(id); ctx.close(); }, pause(){ ctx.suspend(); }, resume(){ ctx.resume(); } };
}

function cdGeom(i){
  const m = cdMeshes[i];
  if (m.userData.geomInfo) return m.userData.geomInfo;
  m.updateWorldMatrix(true,false);
  const out = new THREE.Vector3(1,0,1).normalize();   // the shelf sits against wall A
  const side = new THREE.Vector3().crossVectors(out, UP).normalize();
  const pos = m.geometry.attributes.position, v = new THREE.Vector3();
  let so=[1e9,-1e9], ss=[1e9,-1e9], sy=[1e9,-1e9];
  for (let k=0; k<pos.count; k++){ v.fromBufferAttribute(pos,k);
    const a=v.dot(out), b=v.dot(side); so=[Math.min(so[0],a),Math.max(so[1],a)]; ss=[Math.min(ss[0],b),Math.max(ss[1],b)]; sy=[Math.min(sy[0],v.y),Math.max(sy[1],v.y)]; }
  return (m.userData.geomInfo = { out, side, w:so[1]-so[0], t:ss[1]-ss[0], h:sy[1]-sy[0],
    home:{ pos:m.position.clone(), quat:m.quaternion.clone() } });
}

  const words = text.split(' '); let line = '', lines = [];
  for (const w of words){ const t = line ? line+' '+w : w; if (x.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  lines.push(line); lines.forEach((l,k)=>x.fillText(l, cx, y + k*lh)); return lines.length;
}

  if (cs){ cs.k += (cs.target - cs.k)*0.1; applyCase(cs); if (!reduce) cs.disc.rotation.z -= 0.02 + cs.k*0.1; }
  if (dragX === null && !reduce) inspectRot += (Math.sin(time*0.0015)*0.25 - inspectRot)*0.02;
  m.quaternion.copy(new THREE.Quaternion().setFromAxisAngle(UP, inspectRot).multiply(inspectBase.quat));
  m.position.copy(inspectBase.pos); if (!reduce) m.position.y += Math.sin(time*0.002)*0.004;
}
// floating ♪ notes above the boombox while it plays
const NOTE_COLORS = ['#f2b36b','#ffc8d6','#bde0fe','#caffbf','#fdffb6'];
const noteTextures = ['♪','♫','♬','♩'].map(ch=>{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const x = cv.getContext('2d');
  x.font = 'bold 104px "Segoe UI Symbol","Apple Symbols","Noto Music","DejaVu Sans",serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';

  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;

const notes = []; let noteClock = 0;
function spawnNote(){
  const box = new THREE.Box3().setFromObject(playerLid), c = box.getCenter(new THREE.Vector3());
  const mat = new THREE.SpriteMaterial({ map:noteTextures[Math.random()*4|0], color:NOTE_COLORS[Math.random()*5|0], transparent:true, depthWrite:false, opacity:0 });
  const s = new THREE.Sprite(mat), sc = 0.07 + Math.random()*0.05; s.scale.set(sc, sc, 1);
  scene.add(s);
  notes.push({ s, age:0, life:2.2+Math.random()*0.9, x0:c.x+(Math.random()-0.5)*0.22, y0:box.max.y+0.03, z0:c.z+(Math.random()-0.5)*0.12,
               vx:(Math.random()-0.5)*0.08, vz:(Math.random()-0.5)*0.08, ph:Math.random()*6 });
}
function updateNotes(dt){
  if (isPlaying() && playerLid && isOpen && !reduce){
    noteClock -= dt;
    if (noteClock <= 0){ noteClock = 0.3 + Math.random()*0.25; spawnNote(); }
  }
  for (let i = notes.length-1; i >= 0; i--){
    const n = notes[i]; n.age += dt; const k = n.age / n.life;
    n.s.position.set(n.x0 + Math.sin(n.age*3 + n.ph)*0.05 + n.vx*n.age, n.y0 + n.age*0.34, n.z0 + n.vz*n.age);
    n.s.material.opacity = Math.min(1, k*5) * (1-k);
    n.s.material.rotation = Math.sin(n.age*2 + n.ph)*0.35;
    if (k >= 1){ scene.remove(n.s); n.s.material.dispose(); notes.splice(i,1); }
  }
  if (playerDisplay) playerDisplay.material.emissiveIntensity = isPlaying() ? 2.4 + Math.sin(performance.now()*0.012)*0.9 : 1;
}

/* ---------- clean bowl inside the head ----------
   The scanned bust is a fused shell, so the cut-open head shows messy hair layers inside.
   Hide that: build a smooth bowl wall + rim ring that follow the cut outline, and discard
   any inward-facing bust surfaces inside the bowl. A matching cap covers the lid's underside. */
const BOWL = { N:96, thick:0.07 };
let bowlInfo = null;   // outline of the bowl floor, used by the cat so she can walk all the way to the edge
function setupBowl(root){
  const bust = root.getObjectByName('Bust'); if (!bust || !lid) return;
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(bust.matrixWorld).invert();
  const cutY = new THREE.Vector3().setFromMatrixPosition(lid.matrixWorld).applyMatrix4(inv).y;
  const N = BOWL.N, xs = [], zs = [];
  let insideCol = new THREE.Color(0x8a3a32);
  const shellMeshes = [];
  bust.traverse(o=>{
    if (!o.isMesh) return;
    const name = (o.material && o.material.name) || '';
    if (/HeadInside/.test(name)){ insideCol = o.material.color.clone(); o.visible = false; return; }
    if (!/SV_/.test(name)) return;
    o.material = o.material.clone(); shellMeshes.push(o);
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld), pa = o.geometry.attributes.position, v = new THREE.Vector3();
    for (let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m); if (Math.abs(v.y-cutY) < 0.008){ xs.push(v.x); zs.push(v.z); } }
  });
  if (xs.length < 50) return;
  const cx = (Math.min(...xs)+Math.max(...xs))/2, cz = (Math.min(...zs)+Math.max(...zs))/2;
  const bin = (x,z)=>((Math.floor((Math.atan2(z-cz, x-cx)+Math.PI)/(2*Math.PI)*N))%N+N)%N;
  let R = new Array(N).fill(0);
  for (let i=0;i<xs.length;i++){ const k = bin(xs[i],zs[i]); R[k] = Math.max(R[k], Math.hypot(xs[i]-cx, zs[i]-cz)); }
  for (let p=0;p<4;p++) R = R.map((r,i)=> r>0 ? r : Math.max(R[(i+N-1)%N], R[(i+1)%N]));
  const smooth = (A, n)=>{ for (let p=0;p<n;p++) A = A.map((r,i)=>(A[(i+N-1)%N]+2*r+A[(i+1)%N])/4); return A; };
  R = smooth(R, 8);
  // keep the wall clear of the room furniture
  const need = new Array(N).fill(0); let floorY = Infinity;
  room.updateMatrixWorld(true);
  room.traverse(o=>{
    if (!o.isMesh) return;
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld), pa = o.geometry.attributes.position, v = new THREE.Vector3();
    for (let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(m); floorY = Math.min(floorY, v.y); }
  });
  let Rin = R.map((r,i)=>Math.min(r-0.015, Math.max(r-BOWL.thick, need[i]+0.03)));
  Rin = smooth(Rin, 3).map((r,i)=>Math.min(R[i]-0.01, Math.max(r, need[i]+0.02)));
  const yb = floorY - 0.03;
  bowlInfo = { cx, cz, Rin:Rin.slice(), N, bin };
  const ang = i=>-Math.PI + (i+0.5)*2*Math.PI/N;
  // The bowl becomes part of the room: same terracotta as the room walls, a dark baseboard,
  // and the wooden floor carried right out to the edge.
  const lin = (r,g,b)=>new THREE.Color().setRGB(r,g,b, THREE.LinearSRGBColorSpace);
  const meanCol = (name, fb)=>{
    const o = room.getObjectByName(name), ca = o && o.geometry.attributes.color;
    if (!ca) return fb;
    let r=0,g=0,b=0; for (let i=0;i<ca.count;i++){ r+=ca.getX(i); g+=ca.getY(i); b+=ca.getZ(i); }
    return lin(r/ca.count, g/ca.count, b/ca.count);
  };
  const wallCol = meanCol('WallA', lin(0.42,0.11,0.075)), baseCol = meanCol('Baseboard', lin(0.06,0.03,0.018)), woodCol = meanCol('Floor', lin(0.15,0.067,0.033));
  wallCol.copy(lin(0.78, 0.74, 0.68));   // warm white walls
  insideCol = wallCol;
  const floorObj = room.getObjectByName('Floor');
  let floorTop = floorY + 0.03;
  if (floorObj){ const bb = new THREE.Box3().setFromObject(floorObj); floorTop = bb.max.clone().applyMatrix4(inv).y; }
  bowlInfo.floorTop = floorTop;
  const bbH = 0.04;
  // wall: three bands of quads (wall above, baseboard, below the floor), vertex coloured
  const wp = [], wc = [], wi = [];
  const ys = [cutY, floorTop+bbH, floorTop+bbH, floorTop-0.005, floorTop-0.005, yb];
  const cs = [wallCol, wallCol, baseCol, baseCol, baseCol, baseCol];
  for (let i=0;i<=N;i++){ const a = ang(i%N), r = Rin[i%N];
    for (let k=0;k<ys.length;k++){ wp.push(cx+r*Math.cos(a), ys[k], cz+r*Math.sin(a)); wc.push(cs[k].r, cs[k].g, cs[k].b); } }
  const S = ys.length;
  for (let i=0;i<N;i++) for (const k of [0,2,4]){ const a=i*S+k, b=a+1, c=(i+1)*S+k, d=c+1; wi.push(a,c,b, b,c,d); }
  const wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.Float32BufferAttribute(wp,3)); wg.setAttribute('color', new THREE.Float32BufferAttribute(wc,3)); wg.setIndex(wi); wg.computeVertexNormals();
  const wall = new THREE.Mesh(wg, new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.8, side:THREE.BackSide })); wall.name = 'BowlWall'; bust.add(wall);
  // wooden floor filling the whole bowl (planks run the same way as the room's floor)
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512; const x2 = cv.getContext('2d');
  let seed = 7; const rnd = ()=> (seed = (seed*9301+49297) % 233280) / 233280;
  for (let p=0;p<8;p++){
    let v = 0;
    while (v < 512){ const len = 160 + rnd()*260, sh = 0.82 + rnd()*0.4;
      x2.fillStyle = '#' + woodCol.clone().multiplyScalar(sh).getHexString(THREE.SRGBColorSpace);
      x2.fillRect(p*128, v, 128, len); x2.fillStyle = 'rgba(0,0,0,.35)'; x2.fillRect(p*128, v, 128, 2); v += len; }
    x2.fillStyle = 'rgba(0,0,0,.4)'; x2.fillRect(p*128, 0, 3, 512);
  }
  const ftex = new THREE.CanvasTexture(cv); ftex.colorSpace = THREE.SRGBColorSpace; ftex.wrapS = ftex.wrapT = THREE.RepeatWrapping; ftex.anisotropy = 4;
  const plank = 0.158, across = new THREE.Vector2(Math.SQRT1_2, Math.SQRT1_2), along = new THREE.Vector2(Math.SQRT1_2, -Math.SQRT1_2);
  const fp = [cx, floorTop-0.003, cz], fi = [];
  for (let i=0;i<N;i++){ const a = ang(i), r = Rin[i]; fp.push(cx+r*Math.cos(a), floorTop-0.003, cz+r*Math.sin(a)); }
  for (let i=0;i<N;i++) fi.push(0, 1+((i+1)%N), 1+i);
  const fuv = [];
  for (let i=0;i<fp.length;i+=3){ const px = fp[i], pz = fp[i+2]; fuv.push((px*across.x + pz*across.y)/(8*plank), (px*along.x + pz*along.y)/1.2); }
  const fg = new THREE.BufferGeometry(); fg.setAttribute('position', new THREE.Float32BufferAttribute(fp,3)); fg.setAttribute('uv', new THREE.Float32BufferAttribute(fuv,2)); fg.setIndex(fi); fg.computeVertexNormals();
  const floorDisc = new THREE.Mesh(fg, new THREE.MeshStandardMaterial({ map:ftex, roughness:0.7, side:THREE.DoubleSide })); floorDisc.name = 'BowlFloor'; bust.add(floorDisc);
  // bottom
  const bp = [cx, yb, cz], bi = [];
  for (let i=0;i<N;i++){ const a = ang(i), r = Rin[i]; bp.push(cx+r*Math.cos(a), yb, cz+r*Math.sin(a)); }
  for (let i=0;i<N;i++) bi.push(0, 1+((i+1)%N), 1+i);
  const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.Float32BufferAttribute(bp,3)); bg.setIndex(bi); bg.computeVertexNormals();
  bust.add(new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ color:insideCol, roughness:0.85, side:THREE.DoubleSide })));
  // rim ring over the cut edge
  const rimCol = wallCol.clone().lerp(new THREE.Color(1,1,1), 0.18);
  const ring = (y, r0, r1, ox=0, oz=0)=>{
    const p = [], idx = [];
    for (let i=0;i<=N;i++){ const a = ang(i%N); p.push(cx-ox+r0[i%N]*Math.cos(a), y, cz-oz+r0[i%N]*Math.sin(a), cx-ox+r1[i%N]*Math.cos(a), y, cz-oz+r1[i%N]*Math.sin(a)); }
    for (let i=0;i<N;i++){ const a=2*i, b=2*i+1, c=2*i+2, d=2*i+3; idx.push(a,b,c, b,d,c); }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p,3)); g.setIndex(idx); g.computeVertexNormals(); return g;
  };
  const rim = new THREE.Mesh(ring(cutY+0.004, Rin, R.map(r=>r+0.02)), new THREE.MeshStandardMaterial({ color:rimCol, roughness:0.75, side:THREE.DoubleSide }));
  rim.name = 'BowlRim'; bust.add(rim);
  // cap under the lid, in the lid's own space (its origin sits on the cut plane)
  const lp = new THREE.Vector3().setFromMatrixPosition(lid.matrixWorld).applyMatrix4(inv);
  lid.traverse(o=>{ if (o.isMesh && /LidInside/.test((o.material && o.material.name) || '')) o.visible = false; });
  const zero = new Array(N).fill(0.001);
  const cap = new THREE.Mesh(ring(-0.004, zero, R.map(r=>r+0.02), lp.x, lp.z), new THREE.MeshStandardMaterial({ color:rimCol, roughness:0.75, side:THREE.DoubleSide }));
  cap.name = 'LidCap'; lid.add(cap);
  // hide inward-facing bust surfaces inside the bowl
  const uR = { value: Rin.map(r=>r+0.004) }, uB = { value: new THREE.Vector4(cx, cz, yb, cutY+0.02) };
  for (const o of shellMeshes){
    o.material.onBeforeCompile = sh=>{
      sh.uniforms.uBowlR = uR; sh.uniforms.uBowl = uB;
      sh.vertexShader = 'varying vec3 vBP; varying vec3 vBN;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n vBP = position; vBN = normal;');
      sh.fragmentShader = `uniform float uBowlR[${N}]; uniform vec4 uBowl; varying vec3 vBP; varying vec3 vBN;\n` + sh.fragmentShader.replace('void main() {', `void main() {
        if (vBP.y > uBowl.z && vBP.y < uBowl.w) {
          vec2 d = vBP.xz - uBowl.xy; float r = length(d);
          int k = int(floor((atan(d.y, d.x) + 3.14159265) / 6.28318531 * ${N}.0));

/* ---------- fit the furniture to the round room ----------
   The old room was a square corner (two flat walls). The head is round, so the flat walls and
   the small square floor are removed, and everything that stood against a wall is slid out to the
   curved wall and turned to face the middle. Free-standing pieces (TV corner) spread out to match. */
let layoutFades = null;
function setupLayout(){
  if (!bowlInfo) return;
  room.updateMatrixWorld(true);
  const b = bowlInfo, rIn = (x,z)=>b.Rin[b.bin(x,z)];
  const floor = room.getObjectByName('Floor');
  const fb = floor ? catBox(floor) : null;
  const backX = fb ? (fb.min.x+fb.max.x)/2 : 0, backZ = fb ? fb.min.z : -0.698;
  const oldC = fb ? new THREE.Vector2((fb.min.x+fb.max.x)/2, (fb.min.z+fb.max.z)/2) : new THREE.Vector2(0,0.194);
  const half = fb ? (fb.max.x-fb.min.x)/2 : 0.892;
  const WALLS = { A:new THREE.Vector2(1,1).normalize(), B:new THREE.Vector2(-1,1).normalize() };
  const dist = (w,x,z)=>(w==='A' ? ((x-backX)+(z-backZ)) : ((z-backZ)-(x-backX)))/Math.SQRT2;
  // sort the room's pieces into groups that move together
  const keyOf = o=>{
    let name = o.name || ''; if (!name){ o.traverse(c=>{ if (!name && c.isMesh) name = c.name; }); }
    if (/^(WallA|WallB|Baseboard|BaseboardB|Floor|FloorBase)$/.test(name)) return 'hide';
    let m;
    if (/^(CDShelf|CDPlayer|CD_)/.test(name)) return 'cd';
    if (/^Guitar/.test(name)) return 'guitar';
    if (/^(Shelf|ShelfBook)/.test(name)) return 'shelf';
    if ((m = /^(?:Poster|PosterFrame)_(\d+)/.exec(name))) return 'poster'+m[1];
    if ((m = /^([AB])Poster(?:Frame)?_(\d+)/.exec(name))) return 'my'+m[1]+m[2];
    if (/^Window/.test(name)) return 'window';
    if (/^LightSwitch/.test(name)) return 'switch';
    if (/^Clock/.test(name)) return 'clock';
    if (/^(Desk|DrawerLine|Keyboard|Mouse|Monitor_|Notebook|Pen|Chair(Seat|Back|Post|Base)|TrashBin)/.test(name)) return 'desk';
    if (/^(BedFrame|Mattress|Blanket|Pillow|Headboard)/.test(name)) return 'bed';
    if (/^(Nightstand|Phone_)/.test(name)) return 'night';
    if (/^(TV_|TVDesk|TVChair)/.test(name)) return 'tv';
    return null;
  };
  const groups = new Map();
  for (const o of [...room.children]){
    const k = keyOf(o); if (!k) continue;
    if (k === 'hide'){ o.visible = false; continue; }
    if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o);
  }
  const pts = objs=>{ const out = [], v = new THREE.Vector3(); for (const o of objs) o.traverse(c=>{ if (!c.isMesh) return;
    const pa = c.geometry.attributes.position; c.updateWorldMatrix(true,false);
    const step = Math.max(1, Math.floor(pa.count/400));
    for (let i=0;i<pa.count;i+=step){ v.fromBufferAttribute(pa,i).applyMatrix4(c.matrixWorld); room.worldToLocal(v); out.push(v.clone()); } }); return out; };
  const angOf = v=>Math.atan2(v.x, v.y);   // v is (x, z)
  layoutFades = [];
  for (const [k, objs] of groups){
    const P = pts(objs); if (!P.length) continue;
    const box = new THREE.Box3().setFromPoints(P), c = box.getCenter(new THREE.Vector3());
    // which wall (if any) is it standing against?
    let wall = null, dmin = Infinity;
    for (const w of ['A','B']){ const d = Math.min(...P.map(p=>dist(w,p.x,p.z))); if (d < 0.08 && d < dmin){ dmin = d; wall = w; } }
    const pivot = new THREE.Group(); pivot.name = 'Layout_'+k; room.add(pivot);
    if (wall){
      const n = WALLS[wall], t = new THREE.Vector2(-n.y, n.x);
      // contact point: middle of the piece, on its back face
      const dc = dist(wall, c.x, c.z);
      const pc = new THREE.Vector2(c.x, c.z).addScaledVector(n, dmin - dc);
      // width along the wall, so a flat back doesn't poke through the curve
      let tmin = Infinity, tmax = -Infinity; for (const p of P){ const tt = (p.x-pc.x)*t.x + (p.z-pc.y)*t.y; tmin = Math.min(tmin,tt); tmax = Math.max(tmax,tt); }
      const w = tmax - tmin, R0 = rIn(pc.x, pc.y), sag = w*w/(8*Math.max(R0,0.3));
      const gap = 0.012 + sag;
      // slide straight back (out of the old room) until it meets the curved wall
      const q = pc.clone(); let s = 0;
      const outside = p=>Math.hypot(p.x-b.cx, p.y-b.cz) >= rIn(p.x,p.y) - gap;
      if (!outside(q)) { while (!outside(q) && s < 2){ s += 0.004; q.copy(pc).addScaledVector(n, -s); } }
      else { while (outside(q) && s > -2){ s -= 0.004; q.copy(pc).addScaledVector(n, -s); } }
      const inward = new THREE.Vector2(b.cx - q.x, b.cz - q.y).normalize();
      pivot.position.set(pc.x, 0, pc.y);
      for (const o of objs){ pivot.attach(o); }
      pivot.position.set(q.x, 0, q.y);
      pivot.rotation.y = angOf(inward) - angOf(n);
      // flatten children offsets: attach() kept world transforms relative to the old pivot spot
      layoutFades.push({ meshes:[], objs, center:new THREE.Vector3(q.x, c.y, q.y), normal:new THREE.Vector3(-inward.x, 0, -inward.y) });
    } else {
      // free-standing: keep its place relative to the room, spread out to the new edge
      const u = new THREE.Vector2(c.x-oldC.x, c.z-oldC.y), d0 = u.length(); if (d0 > 1e-4) u.divideScalar(d0);
      const tOld = half/Math.max(Math.abs(u.x)+Math.abs(u.y), 1e-3);
      const nx = b.cx + u.x*(d0/tOld)*rIn(b.cx+u.x, b.cz+u.y)*0.92, nz = b.cz + u.y*(d0/tOld)*rIn(b.cx+u.x, b.cz+u.y)*0.92;
      pivot.position.set(c.x, 0, c.z);
      for (const o of objs){ pivot.attach(o); }
      pivot.position.set(nx, 0, nz);
    }
  }
  room.updateMatrixWorld(true);
  for (const f of layoutFades){ f.objs.forEach(o=>o.traverse(c=>{ if (c.isMesh) f.meshes.push(c); })); delete f.objs; room.localToWorld(f.center); }
  bowlInfo.noWalls = true;
}




/* small hand tweaks after the automatic layout: slide a piece along the curved wall (radians, + = away from 'from') */
const LAYOUT_NUDGE = [ { piece:'desk', from:'guitar', by:0.13 } ];
function nudgeLayout(){
  if (!bowlInfo) return;
  const b = bowlInfo, C = new THREE.Vector3(b.cx, 0, b.cz);
  for (const n of LAYOUT_NUDGE){
    const p = room.getObjectByName('Layout_'+n.piece), f = room.getObjectByName('Layout_'+n.from); if (!p || !f) continue;
    const ap = Math.atan2(p.position.z-b.cz, p.position.x-b.cx), af = Math.atan2(f.position.z-b.cz, f.position.x-b.cx);
    const sgn = Math.sign(Math.atan2(Math.sin(ap-af), Math.cos(ap-af))) || 1, d = sgn*n.by;
    const r = Math.hypot(p.position.x-b.cx, p.position.z-b.cz), a = ap + d;
    const rr = r + (b.Rin[b.bin(b.cx+Math.cos(a), b.cz+Math.sin(a))] - b.Rin[b.bin(b.cx+Math.cos(ap), b.cz+Math.sin(ap))]);
    p.position.set(b.cx + Math.cos(a)*rr, p.position.y, b.cz + Math.sin(a)*rr);
    p.rotation.y -= d;   // keep it facing the middle
    if (layoutFades) for (const fd of layoutFades){ if (fd.meshes.some(m=>{ let o=m; while (o && o!==p) o=o.parent; return !!o; })){
      const v = fd.center.clone(); room.worldToLocal(v); const va = Math.atan2(v.z-b.cz, v.x-b.cx)+d, vr = Math.hypot(v.x-b.cx, v.z-b.cz);
      v.set(b.cx+Math.cos(va)*vr, v.y, b.cz+Math.sin(va)*vr); fd.center.copy(room.localToWorld(v)); fd.normal.applyAxisAngle(new THREE.Vector3(0,1,0), -d); } }
  }
  room.updateMatrixWorld(true);
}

      const a = a0 - span*0.94 + 2*span*0.94*rnd(), y = fy + 0.04 + (H-0.07)*rnd(), r = rAt(a) - inset;
      const s = 0.008 + rnd()*0.012, m = new THREE.Mesh(holdGeo, std(colors[i%colors.length], { roughness:0.55 }));
      m.scale.set(s*(1+rnd()*0.6), s*(0.7+rnd()*0.6), s*0.55); m.position.set(b.cx+Math.cos(a)*r, y, b.cz+Math.sin(a)*r);
      m.lookAt(b.cx, y, b.cz); m.rotateZ(rnd()*Math.PI); g.add(m);
    }
    // a crash pad on the floor in front of it
    const ra = a0, rr = rAt(ra) - 0.09;
    const pad = mesh(new THREE.BoxGeometry(0.22, 0.03, 0.14), std(0x2e3a4a, { roughness:0.9 }), b.cx+Math.cos(ra)*rr, fy+0.015, b.cz+Math.sin(ra)*rr);
    pad.rotation.y = Math.atan2(-Math.cos(ra), -Math.sin(ra)); g.add(pad);
    addFade(g, a0);
  }

  // 3) closet in the widest free stretch of wall, with hiking gear in the corner beside it
  { const t = taken();
    const free = (a, w)=>t.every(([c,h])=>Math.abs(wrap(a-c)) > h + w);
    let best = null;
    for (let i=0;i<360;i++){ const a = -Math.PI + i*Math.PI/180; let w = 0; while (w < 1.2 && free(a, w+0.01)) w += 0.01; if (!best || w > best.w) best = { a, w }; }
    if (best && best.w > 0.18){
      const oak = std(0xc8a273, { roughness:0.6 }), oakD = std(0x9a7650, { roughness:0.6 }), brass = std(0xb08850, { metalness:0.6, roughness:0.35 });
      // closet sits to one side of the gap, gear fills the corner on the other side
      const aC = best.a - best.w*0.35, cl = onWall('Layout_closet', aC, 0.075);
      const CW = 0.26, CD = 0.13, CH = 0.52;
      cl.add(mesh(new THREE.BoxGeometry(CW, CH, CD), oak, 0, fy+CH/2+0.012, 0));
      cl.add(mesh(new THREE.BoxGeometry(CW-0.02, 0.012, CD-0.02), oakD, 0, fy+0.006, 0));        // plinth
      cl.add(mesh(new THREE.BoxGeometry(0.003, CH-0.03, 0.002), oakD, 0, fy+CH/2+0.012, CD/2+0.001));   // door split
      for (const sx of [-1,1]) cl.add(mesh(new THREE.CylinderGeometry(0.003,0.003,0.07,8), brass, sx*0.012, fy+CH*0.55, CD/2+0.006));   // handles
      addFade(cl, aC);
      const aG = aC + 0.24/Math.max(rAt(aC), 0.3), gear = onWall('Layout_gear', aG, 0.05);   // tucked right beside the closet
      // backpack
      const bag = new THREE.Group(); bag.position.set(0, fy, -0.005); gear.add(bag);
      const pack = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.08, 6, 12), std(0xc0562f, { roughness:0.85 })); pack.scale.set(1, 1, 0.7); pack.position.y = 0.09; bag.add(pack);
      bag.add(mesh(new THREE.BoxGeometry(0.07, 0.05, 0.02), std(0x7a3a20), 0, 0.07, 0.03));            // front pocket
      bag.add(mesh(new THREE.CapsuleGeometry(0.046, 0.02, 6, 12), std(0x9e4424), 0, 0.17, 0).rotateZ(0));   // lid
      const pad2 = mesh(new THREE.CylinderGeometry(0.018,0.018,0.11,16), std(0x3d6e57)); pad2.rotation.z = Math.PI/2; pad2.position.set(0, 0.205, 0); bag.add(pad2);   // rolled sleeping pad
      for (const sx of [-1,1]) bag.add(mesh(new THREE.BoxGeometry(0.01, 0.1, 0.006), std(0x2a2a2a), sx*0.025, 0.1, -0.034));
      // boots
      for (const sx of [-1,1]){ const boot = new THREE.Group(); boot.position.set(0.085 + sx*0.022, fy, 0.03); boot.rotation.y = sx*0.15; gear.add(boot);
        boot.add(mesh(new THREE.BoxGeometry(0.03, 0.012, 0.07), std(0x2a2420), 0, 0.006, 0.006));    // sole
        boot.add(mesh(new THREE.BoxGeometry(0.028, 0.03, 0.06), std(0x7b5a3a, { roughness:0.9 }), 0, 0.027, 0.004));
        boot.add(mesh(new THREE.BoxGeometry(0.026, 0.035, 0.03), std(0x6a4b30, { roughness:0.9 }), 0, 0.055, -0.012));
        boot.add(mesh(new THREE.BoxGeometry(0.004, 0.03, 0.024), std(0xd04a2a), 0, 0.05, 0.005)); }   // laces
      // trekking poles leaning on the wall
      for (const sx of [-1,1]){ const pole = mesh(new THREE.CylinderGeometry(0.002,0.0025,0.3,6), std(0x444b52, { metalness:0.6, roughness:0.4 }), -0.085 + sx*0.01, fy+0.15, -0.025); pole.rotation.z = sx*0.05 + 0.12; pole.rotation.x = -0.12; gear.add(pole);
        gear.add(mesh(new THREE.CylinderGeometry(0.005,0.005,0.03,8), std(0x111111), -0.085 + sx*0.01 - Math.sin(0.12)*0.14, fy+0.29, -0.042)); }
      // coiled rope + carabiners
      const rope = mesh(new THREE.TorusGeometry(0.03, 0.008, 8, 24), std(0x2d8fd5, { roughness:0.9 }), 0.03, fy+0.008, 0.075); rope.rotation.x = Math.PI/2; gear.add(rope);
      const rope2 = mesh(new THREE.TorusGeometry(0.024, 0.007, 8, 24), std(0x2d8fd5, { roughness:0.9 }), 0.03, fy+0.02, 0.075); rope2.rotation.x = Math.PI/2; gear.add(rope2);
      for (let i=0;i<3;i++){ const c = mesh(new THREE.TorusGeometry(0.008, 0.0018, 6, 12), std([0xf4c430,0xe94b3c,0x3cb371][i], { metalness:0.6, roughness:0.3 }), 0.06+i*0.012, fy+0.004, 0.11); c.rotation.x = Math.PI/2; c.scale.x = 0.7; gear.add(c); }
      addFade(gear, aG);
    }
  }
  room.updateMatrixWorld(true);
}

/* ---------- cozy lighting: lamps instead of an overhead light, plus rugs ----------
   When the head opens the big studio lights dim right down and warm lamps around the room
   take over: an arc floor lamp, a stacked-globe lamp, mushroom lamps, a lantern by the bed. */
const COZY = { dim:0.28, warmth:0xff9a4d };
const lampLights = [];
function setupCozy(){
  if (!bowlInfo || bowlInfo.floorTop === undefined) return;
  const b = bowlInfo, fy = bowlInfo.floorTop;
  const rAt = a=>b.Rin[b.bin(b.cx+Math.cos(a), b.cz+Math.sin(a))];
  // where the furniture is, by angle around the room
  const taken = [];
  room.children.forEach(o=>{ if (/^Layout_/.test(o.name)){
    const box = new THREE.Box3(); o.traverse(c=>{ if (c.isMesh && c.visible) box.expandByObject(c); }); if (box.isEmpty()) return;
    const sz = box.getSize(new THREE.Vector3()), ctr = room.worldToLocal(box.getCenter(new THREE.Vector3()));
    const a = Math.atan2(ctr.z-b.cz, ctr.x-b.cx);
    const r = Math.hypot(ctr.x-b.cx, ctr.z-b.cz), half = Math.atan2(Math.max(sz.x,sz.z)/2, Math.max(r,0.2));
    taken.push([a, half, o.name]); } });
  const free = (a, w)=>taken.every(([t,h])=>{ let d = Math.abs(Math.atan2(Math.sin(a-t), Math.cos(a-t))); return d > h + w; });
  const pickGap = (pref, w)=>{ for (let k=0;k<180;k++){ for (const sgn of [1,-1]){ const a = pref + sgn*k*Math.PI/180; if (free(a,w)) return a; } } return pref; };
  const groupAngle = name=>{ const t = taken.find(x=>x[2]===name); return t ? t[0] : 0; };
  const atWall = (a, inset)=>{ const r = rAt(a) - inset; return new THREE.Vector3(b.cx + Math.cos(a)*r, fy, b.cz + Math.sin(a)*r); };
  const std = (c, o={})=>new THREE.MeshStandardMaterial({ color:c, roughness:0.6, ...o });
  const glowMat = (c, k=2.2)=>new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:k, roughness:0.5 });
  const addLight = (pos, color, intensity, dist)=>{ const L = new THREE.PointLight(color, 0, dist, 2); L.position.copy(pos); room.add(L); L.userData.full = intensity; lampLights.push(L); return L; };
  const brass = std(0xb08850, { metalness:0.6, roughness:0.35 }), black = std(0x1c1a1a, { metalness:0.4, roughness:0.4 });
  const grp = (name, pos)=>{ const g = new THREE.Group(); g.name = 'Cozy_'+name; g.position.copy(pos); room.add(g); return g; };
  const mesh = (geo, mat, x=0, y=0, z=0)=>{ const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); return m; };

  // 1) arc floor lamp with an orange dome, leaning over the TV corner
  const tvA = groupAngle('Layout_tv');
  const tvObj = room.getObjectByName('Layout_tv');
  { const a = pickGap(tvA + 1.0, 0.1), base = atWall(a, 0.07), g = grp('ArcLamp', base);
    const to = tvObj ? tvObj.position.clone().setY(fy) : new THREE.Vector3(b.cx, fy, b.cz);
    const dir = to.clone().sub(base).setY(0).normalize(), reach = 0.22, H = 0.42;
    g.add(mesh(new THREE.CylinderGeometry(0.035,0.04,0.012,24), black, 0, 0.006, 0));
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,0.01,0), new THREE.Vector3(0,H*1.15,0), new THREE.Vector3(dir.x*reach, H, dir.z*reach));
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.004, 6), brass));
    const tip = new THREE.Vector3(dir.x*reach, H-0.012, dir.z*reach);
    const dome = mesh(new THREE.SphereGeometry(0.05, 24, 12, 0, Math.PI*2, 0, Math.PI/2), std(0xff8a2a, { side:THREE.DoubleSide, emissive:0xff6a10, emissiveIntensity:0.6 }), tip.x, tip.y, tip.z);
    g.add(dome); g.add(mesh(new THREE.SphereGeometry(0.018, 16, 10), glowMat(0xffd08a, 3), tip.x, tip.y-0.008, tip.z));
    addLight(base.clone().add(tip).add(new THREE.Vector3(0,-0.04,0)), 0xffa155, 1.8, 1.1);
  }
  // 2) stacked glowing-globe floor lamp, between the bed and the desk
  { const a = pickGap((groupAngle('Layout_bed')+groupAngle('Layout_desk'))/2, 0.05), base = atWall(a, 0.06), g = grp('GlobeLamp', base);
    g.add(mesh(new THREE.CylinderGeometry(0.025,0.03,0.01,20), brass, 0, 0.005, 0));
    g.add(mesh(new THREE.CylinderGeometry(0.003,0.003,0.3,8), brass, 0, 0.15, 0));
    [0.12, 0.19, 0.26].forEach((y,i)=>g.add(mesh(new THREE.SphereGeometry(0.028-i*0.002, 20, 14), glowMat(0xffe2b0, 2.6), 0.012, y, 0)));
    addLight(base.clone().add(new THREE.Vector3(0, 0.2, 0)), 0xffc27a, 1.3, 1.0);
  }
  // 3) mushroom lamps: on the desk and on top of the CD shelf
  const mushroom = (parentName, finder, color)=>{
    const host = room.getObjectByName(parentName); if (!host) return;
    let topMesh = null; host.traverse(o=>{ if (o.isMesh && finder.test(o.name)) topMesh = o; });
    if (!topMesh) return;
    const box = new THREE.Box3().setFromObject(topMesh), c = box.getCenter(new THREE.Vector3());
    const w = room.worldToLocal(new THREE.Vector3(c.x, box.max.y, c.z));
    const toWall = new THREE.Vector3(w.x-b.cx, 0, w.z-b.cz).normalize();
    const side = new THREE.Vector3(-toWall.z, 0, toWall.x);
    const p = w.clone().addScaledVector(toWall, 0.03).addScaledVector(side, 0.11);
    const g = grp('Mushroom_'+parentName, p);
    g.add(mesh(new THREE.CylinderGeometry(0.012,0.016,0.045,16), std(0xf3ead8), 0, 0.022, 0));
    g.add(mesh(new THREE.SphereGeometry(0.034, 24, 12, 0, Math.PI*2, 0, Math.PI/2), glowMat(color, 1.6), 0, 0.044, 0));
    addLight(p.clone().add(new THREE.Vector3(0, 0.05, 0)), color, 0.8, 0.7);
  };
  mushroom('Layout_desk', /^DeskTop$/, 0xffb060);
  mushroom('Layout_cd', /^CDShelf_Top$/, 0xff8f6a);
  // 4) little lantern next to the phone on the nightstand
  { const host = room.getObjectByName('Layout_night'); let top = null;
    if (host) host.traverse(o=>{ if (o.isMesh && /^Nightstand$/.test(o.name)) top = o; });
    if (top){ const box = new THREE.Box3().setFromObject(top), c = box.getCenter(new THREE.Vector3());
      const w = room.worldToLocal(new THREE.Vector3(c.x, box.max.y, c.z));
      const toC = new THREE.Vector3(b.cx-w.x, 0, b.cz-w.z).normalize(), side = new THREE.Vector3(-toC.z, 0, toC.x);
      const p = w.clone().addScaledVector(side, -0.06).addScaledVector(toC, 0.02);
      const g = grp('Lantern', p);
      g.add(mesh(new THREE.SphereGeometry(0.03, 20, 14), glowMat(0xffd59a, 2.2), 0, 0.034, 0));
      g.children[0].scale.y = 1.15;
      addLight(p.clone().add(new THREE.Vector3(0,0.05,0)), 0xffb070, 0.8, 0.7); } }
  // 5) fairy lights strung along the top of the wall behind the bed
  { const a0 = groupAngle('Layout_bed'), n = 22, pts = [];
    for (let i=0;i<n;i++){ const a = a0 - 0.55 + 1.1*i/(n-1), r = rAt(a) - 0.012, sag = 0.03*Math.sin(Math.PI*((i%6)/5));
      pts.push(new THREE.Vector3(b.cx+Math.cos(a)*r, fy + 0.52 - sag, b.cz+Math.sin(a)*r)); }
    const g = new THREE.Group(); g.name = 'Cozy_Fairy'; room.add(g);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, 0.0015, 4), black));
    const bulb = new THREE.SphereGeometry(0.007, 8, 6);
    pts.forEach((p,i)=>{ if (i%1===0) g.add(mesh(bulb, glowMat(i%3 ? 0xffd27a : 0xffa860, 3), p.x, p.y-0.006, p.z)); });
    addLight(pts[Math.floor(n/2)].clone().add(new THREE.Vector3(0,-0.04,0)).lerp(new THREE.Vector3(b.cx, fy+0.4, b.cz), 0.1), 0xffc070, 0.9, 1.0);
  }

  // ---- rugs ----
  const rugTex = (draw, size=512)=>{ const cv = document.createElement('canvas'); cv.width = cv.height = size; const x = cv.getContext('2d'); draw(x); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
  const rug = (name, pos, w, d, rot, tex, h=0.004)=>{
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [std(0x2a1c18), std(0x2a1c18), new THREE.MeshStandardMaterial({ map:tex, roughness:0.95, transparent:true, alphaTest:0.5 }), std(0x2a1c18), std(0x2a1c18), std(0x2a1c18)]);
    m.material[0].visible = m.material[1].visible = m.material[3].visible = m.material[4].visible = m.material[5].visible = false;
    m.name = 'Rug_'+name; m.position.set(pos.x, fy + h/2 + 0.001, pos.z); m.rotation.y = rot; room.add(m); return m;
  };
  // big koi pond rug in the middle of the floor
  const koi = rugTex(x=>{
    x.save(); x.scale(2,2);   // drawn on a 512 grid, canvas is 1024
    // squiggly pond outline
    const blob = (r)=>{ x.beginPath(); for (let i=0;i<=160;i++){ const a = i/160*Math.PI*2;
      const rr = r*(1 + 0.10*Math.sin(3*a+0.4) + 0.07*Math.sin(5*a+1.3) + 0.05*Math.sin(8*a+2.1) + 0.03*Math.sin(13*a));
      const px = 256+Math.cos(a)*rr, py = 256+Math.sin(a)*rr*0.82; i ? x.lineTo(px,py) : x.moveTo(px,py); } x.closePath(); };
    blob(222); x.fillStyle = '#1d4631'; x.fill();
    x.save(); blob(222); x.clip();
    // carved water swirls
    for (let k=0;k<18;k++){ x.strokeStyle = k%2 ? 'rgba(96,160,118,.32)' : 'rgba(8,34,22,.38)'; x.lineWidth = 6+(k%3)*5; x.lineCap = 'round'; x.beginPath();
      for (let i=0;i<=60;i++){ const t = i/60, px = t*512, py = 10+k*30 + Math.sin(t*Math.PI*2*1.7 + k*0.9)*26 + Math.sin(t*Math.PI*2*4.1 + k)*8; i ? x.lineTo(px,py) : x.moveTo(px,py); } x.stroke(); }
    // a koi: tapered body, head, fins, flowing split tail, markings, eye
    const fish = (fx, fy, ang, sc, spots, base='#f6eee2')=>{
      x.save(); x.translate(fx,fy); x.rotate(ang); x.scale(sc,sc);
      x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(4,6,44,14,0,0,Math.PI*2); x.fill();   // shadow
      // tail (two flowing lobes)
      x.fillStyle = base; x.globalAlpha = 0.92;
      x.beginPath(); x.moveTo(-30,0); x.bezierCurveTo(-48,-6,-62,-22,-78,-26); x.bezierCurveTo(-70,-12,-66,-4,-60,0); x.bezierCurveTo(-66,4,-70,12,-78,26); x.bezierCurveTo(-62,22,-48,6,-30,0); x.fill();
      x.globalAlpha = 1;
      x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 1;
      for (const s of [-1,1]) for (let k=0;k<4;k++){ x.beginPath(); x.moveTo(-34,0); x.quadraticCurveTo(-50,s*(4+k*3),-70+k*2,s*(10+k*4)); x.stroke(); }
      // pectoral + pelvic fins
      x.fillStyle = base;
      for (const s of [-1,1]){
        x.beginPath(); x.moveTo(14,s*9); x.bezierCurveTo(10,s*24,-2,s*30,-8,s*26); x.bezierCurveTo(-2,s*18,4,s*12,8,s*9); x.fill();
        x.beginPath(); x.moveTo(-14,s*7); x.bezierCurveTo(-18,s*16,-24,s*18,-28,s*15); x.bezierCurveTo(-24,s*10,-20,s*8,-18,s*6); x.fill(); }
      // body
      x.beginPath(); x.moveTo(40,0); x.bezierCurveTo(38,-11,22,-15,6,-14); x.bezierCurveTo(-12,-13,-26,-7,-34,-2);
      x.lineTo(-34,2); x.bezierCurveTo(-26,7,-12,13,6,14); x.bezierCurveTo(22,15,38,11,40,0); x.closePath();
      x.fillStyle = base; x.fill();
      x.save(); x.clip();
      for (const [sx,sy,rx,ry,c] of spots){ x.fillStyle = c; x.beginPath(); x.ellipse(sx,sy,rx,ry,0,0,Math.PI*2); x.fill(); }
      x.strokeStyle = 'rgba(0,0,0,.12)'; x.lineWidth = 0.8;   // scale texture
      for (let i=-30;i<36;i+=6){ x.beginPath(); x.arc(i,0,7,-1.1,1.1); x.stroke(); }
      x.restore();
      x.strokeStyle = 'rgba(30,20,10,.45)'; x.lineWidth = 1.2; x.stroke();
      // dorsal fin line
      x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 2; x.beginPath(); x.moveTo(20,0); x.lineTo(-22,0); x.stroke();
      // eyes + whiskers
      x.fillStyle = '#111'; for (const s of [-1,1]){ x.beginPath(); x.arc(30,s*6,2.2,0,Math.PI*2); x.fill(); }
      x.strokeStyle = 'rgba(40,25,15,.6)'; x.lineWidth = 1; for (const s of [-1,1]){ x.beginPath(); x.moveTo(39,s*2); x.quadraticCurveTo(44,s*5,43,s*9); x.stroke(); }
      x.restore(); };
    const R = '#d9461f', O = '#ec8a2c', K = '#1e1a18', G = '#e7b33a';
    fish(170,175,0.5,1.15,[[22,-4,14,9,R],[-6,5,12,7,R],[-24,-3,7,5,R]]);
    fish(345,160,-2.5,1.05,[[12,0,18,10,O],[-18,3,9,6,K]]);
    fish(255,300,2.3,1.2,[[28,0,10,8,R],[0,-5,16,7,K],[-20,4,8,5,R]]);
    fish(135,330,-0.7,0.95,[[10,0,26,13,K],[-22,0,8,6,R]], '#e9e3d6');
    fish(370,320,3.5,1.0,[[18,-3,12,8,G],[-6,4,14,8,R]]);
    fish(255,105,0.1,0.85,[[20,0,10,7,R],[-8,-4,10,6,O]]);
    x.restore();
    blob(222); x.lineWidth = 7; x.strokeStyle = '#123321'; x.stroke();
    x.restore();
  }, 1024);
  // akatsuki cloud rug by the TV corner
  const cloud = rugTex(x=>{
    const puffs = [[150,280,95],[250,220,110],[360,260,100],[300,330,80],[190,345,70]];
    const shape = grow=>{ x.beginPath(); puffs.forEach(([px,py,r])=>{ x.moveTo(px+r+grow,py); x.arc(px,py,r+grow,0,Math.PI*2); }); };
    shape(22); x.fillStyle = '#141414'; x.fill();
    shape(12); x.fillStyle = '#f2efe8'; x.fill();
    shape(0); x.fillStyle = '#c4161c'; x.fill();
    x.strokeStyle = '#f2efe8'; x.lineWidth = 14; x.lineCap = 'round';
    [[150,280,50,-0.3,2.6],[250,220,60,-0.2,2.8],[360,260,52,0.3,3.0]].forEach(([px,py,r,a0,a1])=>{ x.beginPath(); x.arc(px+10,py+10,r,a0,a1); x.stroke(); });
  });
  // round striped rug under the bed side
  const stripes = rugTex(x=>{
    for (let r=250;r>0;r-=22){ x.beginPath(); x.arc(256,256,r,0,Math.PI*2); x.fillStyle = (r/22|0)%2 ? '#e8d8bc' : '#8c5a3c'; x.fill(); }
  });
  const R0 = Math.min(...b.Rin);
  rug('Koi', new THREE.Vector3(b.cx, 0, b.cz), R0*1.05, R0*1.05*0.85, 0.5, koi);

}
// fade between "studio" lighting (closed head) and lamp lighting (open head)
let cozyK = 0;
const studio = [];
function updateCozy(){
  const want = (isOpen || lidAway) ? 1 : 0;
  cozyK += (want - cozyK)*0.05;
  for (const [l, full] of studio) l.intensity = full*(1 - (1-COZY.dim)*cozyK);
  for (const L of lampLights) L.intensity = L.userData.full*cozyK;
  roomLight.color.setHex(0xffb070);
}

/* ---------- walls and lid fade when they block the view ---------- */
const roomCenter = new THREE.Vector3();
const fades = [];   // {meshes, center, normal, opacity}
function setupFades(root){
  root.updateMatrixWorld(true);
  new THREE.Box3().setFromObject(room).getCenter(roomCenter);

  else for (const re of Object.values(groups)){
    const meshes = []; room.traverse(o=>{ if (o.isMesh && re.test(o.name)) meshes.push(o); });
    const wall = meshes.find(m=>/^Wall/.test(m.name));
    const c = new THREE.Box3().setFromObject(wall).getCenter(new THREE.Vector3());
    const n = c.clone().sub(roomCenter); n.y = 0; n.normalize();

  const lc = new THREE.Vector3(); lid.getWorldPosition(lc);
  const ln = lc.clone().sub(roomCenter); ln.y = 0; ln.normalize();

function updateFades(){

      if (f.lid) target = !lidAway ? 1 : (d > 0.3 && !busy ? 0.0 : LID_OPACITY);
      else target = d > 0.05 ? 0.12 : 1;
    }
    f.opacity += (target - f.opacity) * 0.15;
    const op = f.opacity > 0.985 ? 1 : f.opacity;

      m.material.depthWrite = op > 0.5; m.visible = op > 0.02;

function monitorInfo(){

  const pts = []; for (let k=0; k<g.count; k++) pts.push(new THREE.Vector3().fromBufferAttribute(g,k).applyMatrix4(monMesh.matrixWorld));
  const c = pts.reduce((a,b)=>a.add(b), new THREE.Vector3()).multiplyScalar(1/pts.length);
  const n = new THREE.Vector3().subVectors(pts[1], pts[0]).cross(new THREE.Vector3().subVectors(pts[2], pts[0])).normalize();
  if (n.dot(new THREE.Vector3().subVectors(roomCenter, c)) < 0) n.negate();
  let w = 0, h = 0; for (const p of pts){ w = Math.max(w, Math.hypot(p.x-c.x, p.z-c.z)*2); h = Math.max(h, Math.abs(p.y-c.y)*2); }
  return { pts, c, n, w, h };
}

function tween(ms, fn){

/* ---------- Daisy close-up: pet her on top, photos underneath ---------- */
const catSheet = document.getElementById('catSheet');
// Pick a camera spot that can actually see her: try directions all around, skip any where
// furniture, the head shell or anything else sits between the camera and the cat.
const _catRay = new THREE.Raycaster();
function catShot(){
  const c = cat.getWorldPosition(new THREE.Vector3());
  const h = CAT_SIZE*1.45;   // how tall she is
  const dist = h*3.9, lift = h*1.2;
  const eye = c.clone().add(new THREE.Vector3(0, h*0.6, 0));
  const occluders = [];
  rig.traverse(o=>{
    if (!o.isMesh || !o.visible || o.userData.cat || o === catHit) return;
    if (o.material && o.material.visible === false) return;
    if (o.userData.faded) return;
    if (/^(Wall|Baseboard)/.test(o.name)) return;       // walls fade out on their own
    occluders.push(o);
  });
  const cur = camera.position.clone().sub(c); cur.y = 0; if (cur.lengthSq() < 1e-6) cur.set(0,0,1); cur.normalize();
  const toMid = roomCenter.clone().sub(c); toMid.y = 0; if (toMid.lengthSq() > 1e-6) toMid.normalize();
  let best = null;
  for (const liftK of [1, 1.6, 2.4]){
    for (let i=0;i<32;i++){
      const a = i/32*Math.PI*2, d = new THREE.Vector3(Math.sin(a), 0, Math.cos(a));
      const pos = c.clone().addScaledVector(d, dist).add(new THREE.Vector3(0, lift*liftK, 0));
      const ray = pos.clone().sub(eye), len = ray.length();
      _catRay.set(eye, ray.normalize()); _catRay.far = len;
      // also check a little to each side so a table edge can't clip the frame
      const side = new THREE.Vector3(-d.z, 0, d.x).multiplyScalar(h*0.35);
      let blocked = _catRay.intersectObjects(occluders, false).length > 0;
      for (const sgn of [-1, 1]){
        if (blocked) break;
        const o2 = eye.clone().addScaledVector(side, sgn), r2 = pos.clone().addScaledVector(side, sgn).sub(o2), l2 = r2.length();
        _catRay.set(o2, r2.normalize()); _catRay.far = l2;
        blocked = _catRay.intersectObjects(occluders, false).length > 0;
      }
      if (blocked) continue;
      const score = d.dot(cur) + 0.8*d.dot(toMid) - 0.35*(liftK-1);
      if (!best || score > best.score) best = { score, pos };
    }
    if (best) break;   // prefer the lowest height that has a clear view
  }
  const pos = best ? best.pos : c.clone().add(new THREE.Vector3(0, dist*1.4, 0)).addScaledVector(cur, dist*0.3);   // fallback: look down from above
  // the photo strip covers the bottom of the screen; a view offset (see updateCatFraming) keeps her centred above it
  return { pos, look: eye.clone() };
}

/* ---------- the cat: a stubby tuxedo cat that lives in the room ----------
   It walks around the floor (A* on a grid built from the furniture) and picks

let cat = null, catHit = null, catFloorY = 0;
const catJ = {};
const CAT_SIZE = 0.1;
const catGrid = { n:46, x0:0, z0:0, cs:0.04, free:null };
const catActs = {};
const catS = { mode:'act', act:null, t:0, dur:10, path:[], pi:0, from:null, to:null, jt:0, jd:0.55,

function catLocalMatrix(o){ return new THREE.Matrix4().copy(room.matrixWorld).invert().multiply(o.matrixWorld); }
function catBox(o){ o.geometry.computeBoundingBox(); return o.geometry.boundingBox.clone().applyMatrix4(catLocalMatrix(o)); }
function catBoxOf(re){

}

function buildCat(){
  const std = (c, r=0.75)=>new THREE.MeshStandardMaterial({ color:c, roughness:r });

  for (const s of [-1,1]){
    ball(M.eye, 0.12,0.14,0.06, s*0.17,0,0.33, eyes);
    ball(M.pupil, 0.045,0.11,0.03, s*0.17,0,0.365, eyes);
    ball(M.glint, 0.025,0.025,0.015, s*0.17+0.03,0.05,0.392, eyes);
    ball(M.pink, 0.06,0.032,0.02, s*0.3,0.11,0.275, head);   // blush

    ear.position.set(s*0.25,0.6,-0.02); ear.rotation.z = -s*0.38; head.add(ear);

  const wg = new THREE.BufferGeometry(); wg.setAttribute('position', new THREE.Float32BufferAttribute(wp,3));
  head.add(new THREE.LineSegments(wg, new THREE.LineBasicMaterial({ color:0xffffff })));
  // stubby arms and legs on pivots
  const arm = new THREE.CapsuleGeometry(0.085, 0.14, 6, 12), leg = new THREE.CapsuleGeometry(0.1, 0.04, 6, 12);
  for (const s of [-1,1]){
    const a = new THREE.Group(); a.position.set(s*0.34,0.56,0.06); body.add(a);
    const am = new THREE.Mesh(arm, M.black); am.position.y = -0.12; a.add(am);

    catJ[s<0?'armL':'armR'] = a;
    const l = new THREE.Group(); l.position.set(s*0.17,0.2,0.04); body.add(l);
    const lm = new THREE.Mesh(leg, M.black); lm.position.y = -0.08; l.add(lm);

/* ----- floor grid + A* ----- */
function catCell(x,z){ return [Math.floor((x-catGrid.x0)/catGrid.cs), Math.floor((z-catGrid.z0)/catGrid.cs)]; }
function catCenter(i,j){ return [catGrid.x0+(i+0.5)*catGrid.cs, catGrid.z0+(j+0.5)*catGrid.cs]; }
function catFree(i,j){ const n = catGrid.n; return i>=0 && j>=0 && i<n && j<n && catGrid.free[j*n+i] === 1; }
function hull2(pts){
  pts.sort((a,b)=>a[0]-b[0] || a[1]-b[1]);
  const cr = (o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const p of pts){ while (lo.length>1 && cr(lo[lo.length-2], lo[lo.length-1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i=pts.length-1;i>=0;i--){ const p = pts[i]; while (up.length>1 && cr(up[up.length-2], up[up.length-1], p) <= 0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function inHull(h, x, z, m){   // inside the convex hull by at least m
  for (let i=0;i<h.length;i++){
    const a = h[i], b = h[(i+1)%h.length], ex = b[0]-a[0], ez = b[1]-a[1], L = Math.hypot(ex,ez);
    if ((ex*(z-a[1]) - ez*(x-a[0]))/L < m) return false;
  }
  return true;
}
function buildCatGrid(){
  const floor = room.getObjectByName('Floor');
  const fb = catBox(floor); catFloorY = fb.max.y;
  // with the bowl, the floor runs out to its edge, but only in front of the two back walls
  const backX = (fb.min.x+fb.max.x)/2, backZ = fb.min.z;
  const inFront = (x,z,m)=>((x-backX)+(z-backZ))/Math.SQRT2 > m && ((z-backZ)-(x-backX))/Math.SQRT2 > m;
  const inBowl = (x,z,m)=>{ const b = bowlInfo; return Math.hypot(x-b.cx, z-b.cz) < b.Rin[b.bin(x,z)] - m; };
  if (bowlInfo){
    const R = Math.max(...bowlInfo.Rin);
    catGrid.n = 60;
    catGrid.x0 = bowlInfo.cx - R; catGrid.z0 = bowlInfo.cz - R; catGrid.cs = 2*R/catGrid.n;
  } else {
    catGrid.x0 = fb.min.x; catGrid.z0 = fb.min.z;
    catGrid.cs = Math.max(fb.max.x-fb.min.x, fb.max.z-fb.min.z)/catGrid.n;
  }
  const n = catGrid.n;
  // floor outline
  const fm = catLocalMatrix(floor), pa = floor.geometry.attributes.position, v = new THREE.Vector3(), pts = [];
  for (let i=0;i<pa.count;i++){ v.fromBufferAttribute(pa,i).applyMatrix4(fm); pts.push([v.x, v.z]); }
  const hull = hull2(pts);
  const block = new Uint8Array(n*n), top = catFloorY + 0.16, low = catFloorY + 0.012;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3(), P = new THREE.Vector3();
  room.traverse(o=>{
    if (!o.isMesh || o === floor || !o.visible || /^(FloorBase|Rug|Wall|Baseboard)/.test(o.name) || o.userData.cat) return;
    const bb = catBox(o); if (bb.min.y > top || bb.max.y < low) return;
    const m = catLocalMatrix(o), pos = o.geometry.attributes.position, idx = o.geometry.index;
    const tri = idx ? idx.count/3 : pos.count/3;
    for (let t=0;t<tri;t++){
      const ia = idx ? idx.getX(3*t) : 3*t, ib = idx ? idx.getX(3*t+1) : 3*t+1, ic = idx ? idx.getX(3*t+2) : 3*t+2;
      A.fromBufferAttribute(pos,ia).applyMatrix4(m); B.fromBufferAttribute(pos,ib).applyMatrix4(m); C.fromBufferAttribute(pos,ic).applyMatrix4(m);
      if (Math.min(A.y,B.y,C.y) > top || Math.max(A.y,B.y,C.y) < low) continue;
      const e = Math.max(A.distanceTo(B), B.distanceTo(C), C.distanceTo(A));
      const k = Math.min(48, Math.max(1, Math.ceil(e/(catGrid.cs*0.4))));
      for (let a=0;a<=k;a++) for (let b=0;b<=k-a;b++){
        const u = a/k, w = b/k;
        P.set(0,0,0).addScaledVector(A,1-u-w).addScaledVector(B,u).addScaledVector(C,w);
        if (P.y > top || P.y < low - 0.01) continue;
        const [i,j] = catCell(P.x, P.z);
        if (i>=0 && j>=0 && i<n && j<n) block[j*n+i] = 1;
      }
    }
  });
  catGrid.free = new Uint8Array(n*n);
  const r = 0.045;
  for (let j=0;j<n;j++) for (let i=0;i<n;i++){
    const [x,z] = catCenter(i,j);
    if (bowlInfo ? !(inBowl(x,z,r+0.01) && (bowlInfo.noWalls || inFront(x,z,r))) : !inHull(hull, x, z, r)) continue;
    let ok = true;
    for (let dj=-1;dj<=1 && ok;dj++) for (let di=-1;di<=1;di++){

/* ----- deciding what to do next ----- */

    let w = a.w;

    if (id === 'tv' && video && !video.muted) w *= 4;
    opts.push([id, w]);
  }
  opts.push(['wander', catS.last === 'wander' ? 0.8 : 2]);

    const start = catActs.bed || catActs.dance;
    if (start){ catS.pos.copy(start.spot); catS.last = start === catActs.bed ? 'bed' : 'dance'; catBegin({ id:catS.last, ...start }); catS.yaw = catS.faceYaw; catS.dur = 5; }
    else { const [i,j] = catNearestFree(0,0) || [0,0]; const [x,z] = catCenter(i,j); catS.pos.set(x, catFloorY, z); catChoose(); }
    cat.position.copy(catS.pos); cat.rotation.y = catS.yaw;
  } catch (e){ console.warn('cat setup failed', e); cat = null; }
}
function angLerp(a, b, k){ let d = b - a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return a + d*k; }
function updateCat(dt, time){
  if (!cat) return;
  cat.visible = (isOpen || busy) && camMode !== 'computer';
  catHit.userData.faded = !cat.visible;
  if (!cat.visible && catS.petting){ catS.petting = false; catS.petMeter = 0; setPurr(false); }
  catUpdateFx(dt);
  if (!cat.visible) return;
  const S = catS, sp = reduce ? 0.07 : 0.15;
  S.react = Math.max(0, S.react - dt*2.2);
  updatePetting(dt);
  // whenever the boombox is playing, drop everything and go dance next to it
  const music = isPlaying() && catActs.dance && !reduce;
  if (S.hold){
    // posing for her close-up: stay put and look at the camera
    if (S.mode === 'act'){ S.t = Math.min(S.t, S.dur - 1); S.faceYaw = catYawTo(S.pos, room.worldToLocal(camera.position.clone())); }
  } else if (music && S.act && S.act.id !== 'dance'){
    if (S.mode === 'walk') catGoTo({ id:'dance', ...catActs.dance });
    else if (S.mode === 'act'){
      if (S.act.up){ S.mode = 'wait'; S.yaw = catYawTo(S.pos, S.act.approach); catJump(S.act.approach, ()=>catChoose()); }
      else catGoTo({ id:'dance', ...catActs.dance });
    }
  }
  if (S.mode === 'act' && S.act && S.act.id === 'dance'){
    if (music) S.dur = Math.max(S.dur, S.t + 2);          // keep dancing while it plays
    else S.dur = Math.min(S.dur, S.t + 1.5);              // music stopped: wrap it up
  }
  if (S.mode === 'walk' && S.pi >= S.path.length){
    const a = S.act;
    if (a.up){ S.yaw = catYawTo(S.pos, a.spot); catJump(a.spot, ()=>catBegin(a)); }
    else catBegin(a);
  } else if (S.mode === 'walk' && (S.petting || S.swat > 0)){
    // stops walking to enjoy the pets
  } else if (S.mode === 'walk'){
    const tgt = S.path[S.pi];
    const d = new THREE.Vector3(tgt.x-S.pos.x, 0, tgt.z-S.pos.z), L = d.length();
    const want = Math.atan2(d.x, d.z);
    S.yaw = angLerp(S.yaw, want, 1-Math.exp(-dt*10));
    const step = sp*dt*(Math.cos(angLerp(0, want-S.yaw, 1)) > 0.5 ? 1 : 0.25);
    if (L <= step){ S.pos.copy(tgt); S.pi++; } else S.pos.addScaledVector(d, step/L);
    S.walkPh += step/0.018;
  } else if (S.mode === 'jump'){
    S.jt += dt; const k = Math.min(1, S.jt/S.jd);
    const e = k < 0.2 ? 0 : (k-0.2)/0.8;
    S.pos.lerpVectors(S.from, S.to, e); S.pos.y += Math.sin(e*Math.PI)*0.07;
    if (k >= 1){ S.pos.copy(S.to); S.mode = 'wait'; const f = S.after; S.after = null; f && f(); }
  } else if (S.mode === 'act'){
    S.t += dt;
    if (S.petting || S.swat > 0 || S.sulk > 0) S.t = Math.min(S.t, S.dur - 1);   // doesn't leave mid-pet
    S.yaw = angLerp(S.yaw, S.faceYaw + (S.snub > 0 ? Math.PI : 0), 1-Math.exp(-dt*5));
    const pose = S.act.pose;
    S.fxT -= dt;
    if (pose === 'bed' && S.fxT <= 0){ S.fxT = 1.1; catPuff('z', 0.08); }
    if (pose === 'dance' && S.fxT <= 0){ S.fxT = 0.35 + Math.random()*0.2; catNote(); }
    if (pose === 'game'){
      S.win = Math.max(0, S.win - dt);
      if (S.fxT <= 0){ S.fxT = 3 + Math.random()*3; S.win = 1.2; catPuff('star', 0.14); setTimeout(()=>cat && catPuff('star', 0.14), 200); }
    }
    if (pose === 'idle'){
      S.groomT -= dt;
      if (S.groomT < -3 && Math.random() < dt*0.5) S.groomT = 1.8;
    }
    if (pose === 'dance' && !reduce && (S.t % 4) > 3.2) S.faceYaw += dt*Math.PI*2/0.8;   // a little spin
    if (S.t >= S.dur && !reduce){
      const a = S.act;
      if (a.up){ S.mode = 'wait'; S.yaw = catYawTo(S.pos, a.approach); catJump(a.approach, ()=>catChoose()); }
      else catChoose();
    }
  }
  catTargetPose(time, dt);
  catApplyPose(dt);
  cat.position.copy(S.pos); cat.rotation.y = S.yaw;
}

/* ---------- loop ---------- */
const mouse = new THREE.Vector2();
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); cssRenderer.setSize(w, h); camera.aspect = w/h;
  // pull back on narrow screens so the whole bust fits
  camera.fov = w < h ? 44 : 32;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
// in the cat close-up, shift the picture up so she's centred in the space above the photo strip
let catOff = 0;
function updateCatFraming(){
  const want = (camMode === 'cat' && !catSheet.hidden) ? catSheet.getBoundingClientRect().height/2 : 0;
  catOff += (want - catOff)*0.12;
  if (Math.abs(catOff) < 0.5){ if (camera.view && camera.view.enabled){ camera.clearViewOffset(); } catOff = want ? catOff : 0; return; }
  camera.setViewOffset(innerWidth, innerHeight, 0, catOff, innerWidth, innerHeight);
}
let lastT = 0;
renderer.setAnimationLoop(time=>{
  const dt = Math.min(0.05, (time - lastT)/1000 || 0); lastT = time;
  updateNotes(dt);
  updateCat(dt, time);
  if (lcd){ const st = nowPlaying >= 0 ? 'on' : 'off'; if (st === 'on' || lcdText !== 'off'){ drawLcd(time); lcdText = st; } }
  updateInspect(time);
  placeOS();
  if (lid && lidBase && isOpen && !busy && !reduce){
    lid.position.y = lidBase.y + LID_LIFT + Math.sin(time*0.0012)*0.04;
    lid.rotation.z = Math.sin(time*0.0008)*0.03;
  }
  if (tvCtx && tvMesh && tvMesh.material.map === tvTex){ drawTv(time); tvTex.needsUpdate = true; }
  if (monCtx && isOpen){ drawMonitor(time); monTex.needsUpdate = true; }
  // gentle idle sway + look toward the pointer while closed
  const targetY = isOpen ? 0 : mouse.x*0.35, targetX = isOpen ? 0 : mouse.y*0.12;
  if (isOpen || busy){
    // hold the model still while the head is open so the room (and the computer screen) never drift
    rig.rotation.y *= 0.8; rig.rotation.x *= 0.8;
    if (Math.abs(rig.rotation.y) < 1e-4) rig.rotation.y = 0;
    if (Math.abs(rig.rotation.x) < 1e-4) rig.rotation.x = 0;
  } else if (!reduce){
    rig.rotation.y += (targetY + Math.sin(time*0.0006)*0.05 - rig.rotation.y)*0.05;
    rig.rotation.x += (targetX - rig.rotation.x)*0.05;
  }
  if (controls.enabled){ controls.update(); camPos.copy(camera.position); camLook.copy(controls.target); }
  else { camera.position.copy(camPos); camera.lookAt(camLook); }
  updateCatFraming();
  if (!studio.length) [hemiLight, key, fill, rim].forEach(l=>studio.push([l, l.intensity]));
  updateCozy();
  updateFades();
  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
});
</script>
